name = "la-creme-orders"
main = "index.js"
compatibility_date = "2025-01-01"
# Served at la-creme-orders.lacreme.workers.dev — the public URL the site
# (config.js: ordersApi) and the upload page talk to. Without this the
# Worker deploys but is unreachable (Cloudflare edge returns error 1042).
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "la-creme-orders"
# Filled in by: npx wrangler d1 create la-creme-orders
database_id = "56b749e6-a899-4126-b93b-9c5b4a5a222a"

# Media bucket the upload pipeline writes to. Inside the Worker, files are
# read/written via env.MEDIA rather than by bucket name.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "la-creme-media"

# Daily retention sweep (retentionSweep in index.js): purges Rejected/Failed
# upload_items older than 30 days. 03:23 UTC, deliberately off the :00 mark
# so it never lands in the top-of-the-hour scheduler stampede.
# wrangler wants the single [triggers] table here — [[triggers]] (array of
# tables) fails config validation.
[triggers]
crons = ["23 3 * * *"]

# Secrets (never put these in this file), set with:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
